version: '3.8'

services:
  # ================= 1. CƠ SỞ DỮ LIỆU MARIADB =================
  travelhub-db:
    image: mariadb:10.11
    container_name: travelhub-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: travel_enterprise_db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - travelhub-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ================= 2. MESSAGE BROKER RABBITMQ =================
  travelhub-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: travelhub-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # Cổng giao tiếp AMQP cho Backend
      - "15672:15672"   # Cổng quản trị Dashboard trực quan
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - travelhub-network

  # ================= 3. BACKEND SPRING BOOT API =================
  travelhub-backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: travelhub-backend
    restart: always
    depends_on:
      - travelhub-db
      - travelhub-rabbitmq
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://travelhub-db:3306/travel_enterprise_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_RABBITMQ_HOST: travelhub-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    ports:
      - "8081:8081"
    networks:
      - travelhub-network

  # ================= 4. FRONTEND REACT (PHỤC VỤ QUA NGINX) =================
  travelhub-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travelhub-frontend
    restart: always
    depends_on:
      - travelhub-backend
    ports:
      - "80:80"        # Cổng Web chuẩn cho người dùng Internet truy cập
    networks:
      - travelhub-network

volumes:
  mariadb_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  travelhub-network:
    driver: bridge
