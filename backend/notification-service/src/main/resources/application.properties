server.port=8082
spring.application.name=notification-service

# Tự động nạp file .env ở thư mục gốc dự án (dùng chung MAIL_USERNAME, MAIL_PASSWORD)
spring.config.import=optional:file:../.env[.properties],optional:file:../../.env[.properties]

# ================= DATABASE RIÊNG (DATABASE PER SERVICE) =================
spring.datasource.url=${NOTIFICATION_DATASOURCE_URL:jdbc:mysql://localhost:3306/travel_notification_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ================= CẤU HÌNH GỬI MAIL (SPRING MAIL) =================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ================= CẤU HÌNH RABBITMQ + RETRY 3 LẦN =================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=3000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000ms

# ================= ĐĂNG KÝ EUREKA SERVER =================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ================= LOG GỌN ĐẸP =================
logging.level.root=INFO
logging.level.org.hibernate=WARN
logging.level.com.travelhub=INFO
