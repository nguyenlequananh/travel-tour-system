# ==============================================================================
# CẤU HÌNH MÔI TRƯỜNG TEST (H2 IN-MEMORY DATABASE - CHẠY ĐỘC LẬP 100%)
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:travelhub_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Ghi đè MariaDBDialect của application.properties sang H2Dialect cho môi trường test
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Không nạp file .env thật khi chạy test để đảm bảo tính cô lập
spring.config.import=

# JWT Secret giả lập đủ độ dài >= 256-bit cho HS256
jwt.secret=TravelHubTestSecretKeyForJwtSigningMustBeAtLeast32CharactersLong2026!
jwt.expiration=86400000

# Cấu hình giả lập VNPay cho Integration Test
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.tmnCode=TESTTMNCODE
vnpay.hashSecret=TESTVNPAYHASHSECRETKEY2026TRAVELHUB
vnpay.returnUrl=http://localhost:5173/payment-callback

# Cấu hình giả lập Google OAuth2 (tránh lỗi thiếu client-id khi boot SecurityConfig)
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email
app.oauth2.redirect-uri=http://localhost:5173/oauth2/redirect

# Cấu hình giả lập Mail & Gemini AI
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@travelhub.vn
spring.mail.password=test-password
gemini.api.key=test-gemini-key
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# Tắt tự động kết nối RabbitMQ Listener khi chạy Test
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

# Không tự chạy Spring Batch Job lúc khởi động ApplicationContext
spring.batch.job.enabled=false

# Giảm log thừa khi chạy test
logging.level.root=WARN
logging.level.com.travelhub=INFO
logging.file.name=

# Tắt Eureka Client khi chạy test để 65 bài test vẫn chạy độc lập không cần bật Eureka Server
eureka.client.enabled=false
