server.port=8081

# Tự động nạp file .env ở thư mục gốc dự án (khi chạy local từ backend/ hoặc từ root)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ================= KẾT NỐI DATABASE (MARIADB / MYSQL) =================
# Tự động nhận diện: Chạy localhost thì kết nối 3306, lên Docker VPS thì kết nối container travelhub-db
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/travel_enterprise_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ================= CẤU HÌNH HIBERNATE =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ================= CẤU HÌNH BẢO MẬT JWT =================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ================= CẤU HÌNH GỬI MAIL (SPRING MAIL) =================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ================= CẤU HÌNH GOOGLE OAUTH2 =================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}

# ================= CẤU HÌNH GEMINI AI =================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}

# ================= CẤU HÌNH VNPAY =================
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.tmnCode=${VNPAY_TMN_CODE:}
vnpay.hashSecret=${VNPAY_HASH_SECRET:}
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:5173/payment-callback}

# ================= CẤU HÌNH RABBITMQ =================
# Tự động nhận diện: Chạy localhost thì kết nối localhost, lên Docker VPS thì kết nối container travelhub-rabbitmq
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# ================= CẤU HÌNH RETRY TỰ ĐỘNG CHO RABBITMQ =================
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=3000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000ms

# ================= CẤU HÌNH SPRING BATCH =================
# Không tự chạy Batch Job khi khởi động server, chỉ chạy khi Admin bấm Upload CSV
spring.batch.job.enabled=false

# ================= BỘ LỌC CẤP ĐỘ LOG CHUẨN ENTERPRISE =================
logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.messaging=WARN
logging.level.org.springframework.web.socket=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.apache.coyote=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.com.travelhub=INFO

# Tự động ghi log chi tiết vào file logs/travelhub.log
logging.file.name=logs/travelhub.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
